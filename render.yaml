services:
  - type: web
    name: streamify-chat
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --prefix frontend && npm run build --prefix frontend && npm install --omit=dev --prefix backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
